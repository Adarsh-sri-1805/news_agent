[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-news-intelligence-agent"
version = "0.1.0"
description = "Local News Intelligence Agent backend with local Ollama inference"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "News Intelligence Team" }
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.9.0",
    "rank-bm25>=0.2.2",
    "mcp>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers -m \"not live\""
markers = [
    "live: marks tests as requiring live external internet access (run with -m live)",
]
